description: Configuration file for checklist::check_pkg()
package: yes
allowed:
  warnings:
  - motivation: add false positive warning
    value: "checking CRAN incoming feasibility ... WARNING\nMaintainer: 'Thierry Onkelinx
      <thierry.onkelinx@inbo.be>'\n\nNew submission\n\nStrong dependencies not in
      the CRAN or BioC software repositories:\n  citeme\nAvailability using Additional_repositories
      specification:\n  citeme   yes   https://inbo.r-universe.dev\n\nFound the following
      (possibly) invalid URLs:\n  URL: https://ror.org/\n    From: inst/doc/getting_started.html\n
      \   Status: 429\n    Message: Too Many Requests\n\nFound the following (possibly)
      invalid ROR IDs:\n  ID: 00j54wy13\t(from: DESCRIPTION)"
  notes: []
required:
- CITATION
- DESCRIPTION
- R CMD check
- checklist
- documentation
- filename conventions
- folder conventions
- license
- lintr
- organisation
- repository secret
- spelling
spelling:
  default: en-GB
  ignore:
  - .git
  - .github
  - LICENSE.md
  - docs
  - inst/bookdown
  - inst/generic_template/cc0.md
  - inst/generic_template/cc_by_4_0.md
  - inst/generic_template/cc_by_sa_4_0.md
  - inst/generic_template/gplv3.md
  - inst/generic_template/mit.md
pak: []
gha_install: []
