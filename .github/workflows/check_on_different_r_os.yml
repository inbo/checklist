on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: R-CMD-check-OS

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.name }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: 'R release on macOS', os: macOS-latest,   r: 'release', skip_spelling: false, skip_create: false}
          - {name: 'R release on Windows', os: windows-latest, r: 'release', skip_spelling: false, skip_create: false}
          - {name: 'R devel on Ubuntu', os: ubuntu-26.04,   r: 'devel', rspm: "https://packagemanager.rstudio.com/cran/__linux__/resolute/latest", skip_spelling: false, skip_create: false}
          - {name: 'R oldrel on Ubuntu', os: ubuntu-26.04,   r: 'oldrel', rspm: "https://packagemanager.rstudio.com/cran/__linux__/resolute/latest", skip_spelling: false, skip_create: false}

    env:
      _R_CHECK_SYSTEM_CLOCK_: false
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RSPM: ${{ matrix.config.rspm }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      SKIP_SPELLING: ${{ matrix.config.skip_spelling }}
      SKIP_CREATE: ${{ matrix.config.skip_create }}
      ZENODO_SANDBOX: ${{ secrets.ZENODO_SANDBOX }}

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: r-lib/actions/setup-r@3d375b4861295696a870e3f189d4564d4ca9da6d
        with:
          r-version: ${{ matrix.config.r }}
          extra-repositories: https://inbo.r-universe.dev https://cranhaven.r-universe.dev

      - uses: r-lib/actions/setup-pandoc@8efa4208c1e4a4837731d3c22011c7550205df2f

      - uses: r-lib/actions/setup-r-dependencies@8efa4208c1e4a4837731d3c22011c7550205df2f
        with:
          extra-packages: |
            any::rcmdcheck
            inbo/citeme@devel
          needs: check

      - uses: r-lib/actions/check-r-package@196dc04f2cf1bc6b642b368cb754a7b98eb9eec6
        with:
          error-on: '"error"'
