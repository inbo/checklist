on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

name: R-CMD-check-OS

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.name }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: 'R release on macOS', os: macOS-latest,   r: 'release'}
          - {name: 'R release on Windows', os: windows-latest, r: 'release'}
          - {name: 'R devel on Ubuntu', os: ubuntu-26.04,   r: 'devel', rspm: "https://packagemanager.rstudio.com/cran/__linux__/resolute/latest"}
          - {name: 'R oldrel on Ubuntu', os: ubuntu-26.04,   r: 'oldrel', rspm: "https://packagemanager.rstudio.com/cran/__linux__/resolute/latest"}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_SYSTEM_CLOCK_: false
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: r-lib/actions/setup-r@3d375b4861295696a870e3f189d4564d4ca9da6d
        with:
          r-version: ${{ matrix.config.r }}
          extra-repositories: https://inbo.r-universe.dev https://cranhaven.r-universe.dev

      - uses: r-lib/actions/setup-pandoc@6cf11da387d58095e7bd4ce3bcc075bd9aea9716

      - uses: r-lib/actions/setup-r-dependencies@8efa4208c1e4a4837731d3c22011c7550205df2f
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
          needs: check

      - name: windows dependencies
        if: runner.os == 'windows'
        run: |
          Rscript --no-save --no-restore -e 'remotes::install_local()'

      - uses: r-lib/actions/check-r-package@196dc04f2cf1bc6b642b368cb754a7b98eb9eec6
        with:
          error-on: '"error"'
